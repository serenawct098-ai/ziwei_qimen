name: RAG Integrity and Global Logic Audit
on:
  push:
    branches:
      - fix/rag-integrity-regression
    paths:
      - data/**
      - engines/**
      - audit/**
      - tools/repair_rag_integrity.py
      - tools/audit_global_logic.py
      - .github/workflows/rag-integrity-repair.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/repair_rag_integrity.py
      - id: global_audit
        run: python tools/audit_global_logic.py
        continue-on-error: true
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engines/rag_index_v1.json audit/rag_integrity_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair RAG previews from SSOT'
          git push
      - if: steps.global_audit.outcome == 'failure'
        run: exit 1
